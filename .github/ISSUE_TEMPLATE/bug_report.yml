name: Bug report
description: Something in BeetrootSkin does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? For wrong numbers, give both the expected and the shown values.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Hold cooked beef in survival mode
        2. Look at the hunger bar
        3. ...
    validations:
      required: true
  - type: dropdown
    id: world
    attributes:
      label: Where did it happen?
      options:
        - Single-player or hosting a LAN world
        - Multiplayer server or a joined LAN world
        - Both
    validations:
      required: true
  - type: input
    id: beetrootskin
    attributes:
      label: BeetrootSkin version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: levilamina
    attributes:
      label: LeviLamina version
      placeholder: 26.51.7
    validations:
      required: true
  - type: input
    id: minecraft
    attributes:
      label: Minecraft version
      placeholder: 1.26.51.01
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Contents of `mods/BeetrootSkin/config/config.json`, if you changed it.
      render: json
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Relevant lines from `logs/latest.log` in the game folder (lines with `BeetrootSkin`, errors, crash reports).
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
